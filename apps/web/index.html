<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DELTA ERP Enterprise v1.4 — Cloud Command Center (20 Módulos)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              erp: {
                canvas: '#F1F5F9',
                surface: '#FFFFFF',
                navy: '#0B1120',
                blue: '#1D4ED8',
                blueSoft: '#EFF6FF',
              },
            },
            boxShadow: {
              xs: '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.06)',
              card: '0 1px 3px 0 rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.06)',
              elevated: '0 10px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08)',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        background-color: #F1F5F9;
        background-image:
          radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 45%),
          radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.04) 0px, transparent 40%);
        color: #0F172A;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      /* Refinamento global de cartões, tabelas e controles do ERP */
      main .bg-white.rounded-xl {
        box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04), 0 4px 14px -3px rgba(15, 23, 42, 0.05);
        border-color: rgba(226, 232, 240, 0.9);
        transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }
      main .bg-white.rounded-xl:hover {
        border-color: rgba(203, 213, 225, 1);
        box-shadow: 0 4px 18px -4px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      }
      main input,
      main select,
      main textarea {
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }
      main input:focus,
      main select:focus,
      main textarea:focus {
        outline: none;
        border-color: #2563EB !important;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
      }
      main table thead tr {
        background-color: #F8FAFC;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 10.5px;
      }
      main table thead th {
        padding-top: 0.65rem;
        padding-bottom: 0.65rem;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        font-weight: 600;
      }
      main table tbody tr {
        transition: background-color 0.12s ease;
      }
      main table tbody tr:hover {
        background-color: rgba(241, 245, 249, 0.65);
      }
      main table tbody td {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }
      main button {
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }
      main button:active {
        transform: scale(0.985);
      }
      /* Scrollbars elegantes */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.45);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
