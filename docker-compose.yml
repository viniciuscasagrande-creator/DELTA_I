version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: delta-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delta_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delta_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-delta_erp}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delta_admin -d delta_erp']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: delta-erp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-delta_redis_secret} --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-delta_redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: delta-erp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-delta_storage_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-delta_storage_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
